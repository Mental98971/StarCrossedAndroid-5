name: Build STAR CROSSED Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          keytool -genkeypair -v -keystore release.jks -alias starcrossed -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=StarCrossed"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | tail -n 1)
          $ZIPALIGN -v 4 "$APK_FILE" app-release-aligned.apk
          $APKSIGNER sign --ks release.jks --ks-pass pass:password123 --key-pass pass:password123 --out app-release-signed.apk app-release-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-CROSSED-signed-release-apk
          path: app-release-signed.apk
